spring.application.name=event-management-system

# Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=event_management_db;integratedSecurity=true;encrypt=false;trustServerCertificate=true
#spring.datasource.username=sa
#spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# SQL Initialization
spring.sql.init.mode=never
#spring.sql.init.data-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=true

# Server Configuration
server.port=8081
server.servlet.context-path=/api

# Logging
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Application Info
app.name=Event Management System
app.version=1.0.0
app.description=Hệ thống quản lý sự kiện sinh viên

# OAuth2 Configuration (Google Login)
# Hướng dẫn lấy Client ID/Secret: https://console.cloud.google.com/apis/credentials
# 1. Tạo project -> OAuth consent screen -> External
# 2. Tạo OAuth 2.0 Client ID -> Web application
# 3. Thêm Authorized redirect URI: http://localhost:8081/api/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8081/api/login/oauth2/code/google

# Gmail SMTP Configuration (Gửi OTP)
# Hướng dẫn lấy App Password:
# 1. Vào https://myaccount.google.com/security
# 2. Bật xác minh 2 bước (2-Step Verification)
# 3. Vào "App passwords" -> Tạo password cho "Mail"
# 4. Copy 16 ký tự password vào spring.mail.password bên dưới
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:your-email@gmail.com}
spring.mail.password=${SMTP_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
