# =========================================================
# Server
# =========================================================
server.port=${PORT:${SERVER_PORT:8081}}
# Static pages (login.html, landing.html...) and frontend JS call the backend
# under the /api prefix while controllers are mapped at root (/auth, /student...).
# The context-path bridges both, so it must stay set or every /api/* call 404s.
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# =========================================================
# Database (local SQL Server by default)
# =========================================================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=event_management_db;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false

# =========================================================
# Schema init
# =========================================================
# Local SQL Server uses database_full.sql. Do not run the PostgreSQL schema file.
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# =========================================================
# App flags
# =========================================================
app.schema-migration.enabled=true
# Local development normally imports database_full.sql, so do not run the Java
# demo seeder unless it is explicitly enabled.
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.admin-password=${DEMO_ADMIN_PASSWORD:Campus@2026}
app.seed.department-password=${DEMO_DEPARTMENT_PASSWORD:Campus@2026}
app.seed.committee-password=${DEMO_COMMITTEE_PASSWORD:Campus@2026}
app.seed.student-password=${DEMO_STUDENT_PASSWORD:Campus@2026}
app.test-fill.enabled=false
app.past-event-backfill.enabled=false
app.ticket-sync.enabled=true

# =========================================================
# Session Security
# =========================================================
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# =========================================================
# Logging
# =========================================================
logging.level.org.hibernate.SQL=${LOG_HIBERNATE_SQL:DEBUG}
logging.level.org.springframework.web=${LOG_WEB:INFO}

# Internationalization
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# =========================================================
# File upload (ảnh proposal/event tải từ máy)
# =========================================================
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# =========================================================
# Google OAuth2 Login
# Bật khi có GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET (set ở env / Render Dashboard).
# Để trống -> Spring không tạo client registration -> Google Login tự tắt (không lỗi).
# redirect-uri mặc định {baseUrl}/login/oauth2/code/google đã gồm context-path /api.
# =========================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_OAUTH_SCOPES:openid,profile,email,https://www.googleapis.com/auth/forms.body,https://www.googleapis.com/auth/forms.responses.readonly,https://www.googleapis.com/auth/drive.file}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}

# =========================================================
# Gmail SMTP (OTP / notification email)
# Credentials must be supplied through environment variables or the ignored
# application-local.properties file; never commit them to source control.
# =========================================================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.test-connection=false
