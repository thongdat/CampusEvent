# =========================================================
# Server
# =========================================================
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# =========================================================
# Database (PostgreSQL)
# =========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campus_event}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false

# =========================================================
# Schema init
# =========================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-postgresql.sql
spring.jpa.defer-datasource-initialization=true

# =========================================================
# App flags
# =========================================================
app.schema-migration.enabled=false
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.admin-password=${DEMO_ADMIN_PASSWORD:Admin@123}
app.seed.department-password=${DEMO_DEPARTMENT_PASSWORD:Dept@123}
app.seed.committee-password=${DEMO_COMMITTEE_PASSWORD:Cmt@123}
app.seed.student-password=${DEMO_STUDENT_PASSWORD:Stu@123}
app.test-fill.enabled=false
app.past-event-backfill.enabled=false

# =========================================================
# HikariCP (anti-hang pool config for Neon)
# =========================================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=0
spring.datasource.hikari.max-lifetime=150000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.data-source-properties.socketTimeout=45
spring.datasource.hikari.data-source-properties.connectTimeout=15
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.data-source-properties.loginTimeout=15

# =========================================================
# Session Security
# =========================================================
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# =========================================================
# Logging
# =========================================================
logging.level.org.hibernate.SQL=${LOG_HIBERNATE_SQL:DEBUG}
logging.level.org.springframework.web=${LOG_WEB:INFO}
# =========================================================
# i18n (Spring Message Source)
# =========================================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
