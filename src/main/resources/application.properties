# =========================================================
# Server
# =========================================================
server.port=${PORT:${SERVER_PORT:8080}}
# Static pages (login.html, landing.html...) and frontend JS call the backend
# under the /api prefix while controllers are mapped at root (/auth, /student...).
# The context-path bridges both, so it must stay set or every /api/* call 404s.
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# =========================================================
# Database (PostgreSQL)
# =========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campus_event}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false

# =========================================================
# Schema init
# =========================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-postgresql.sql
spring.jpa.defer-datasource-initialization=true

# =========================================================
# App flags
# =========================================================
app.schema-migration.enabled=false
# Seed passwords must be >= 8 chars (DataSeeder validates this and login.html
# also rejects shorter passwords client-side). Defaults are uniform so the local
# demo works out-of-the-box; override per role with the DEMO_* env vars.
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.admin-password=${DEMO_ADMIN_PASSWORD:Campus@2026}
app.seed.department-password=${DEMO_DEPARTMENT_PASSWORD:Campus@2026}
app.seed.committee-password=${DEMO_COMMITTEE_PASSWORD:Campus@2026}
app.seed.student-password=${DEMO_STUDENT_PASSWORD:Campus@2026}
app.test-fill.enabled=false
app.past-event-backfill.enabled=false

# =========================================================
# HikariCP (anti-hang pool config for Neon)
# =========================================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=0
spring.datasource.hikari.max-lifetime=150000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.data-source-properties.socketTimeout=45
spring.datasource.hikari.data-source-properties.connectTimeout=15
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.data-source-properties.loginTimeout=15

# =========================================================
# Session Security
# =========================================================
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# =========================================================
# Logging
# =========================================================
logging.level.org.hibernate.SQL=${LOG_HIBERNATE_SQL:DEBUG}
logging.level.org.springframework.web=${LOG_WEB:INFO}

# Internationalization
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# =========================================================
# File upload (ảnh proposal/event tải từ máy)
# =========================================================
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# =========================================================
# Google OAuth2 Login
# Bật khi có GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET (set ở env / Render Dashboard).
# Để trống -> Spring không tạo client registration -> Google Login tự tắt (không lỗi).
# redirect-uri mặc định {baseUrl}/login/oauth2/code/google đã gồm context-path /api.
# =========================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_OAUTH_SCOPES:openid,profile,email,https://www.googleapis.com/auth/forms.body,https://www.googleapis.com/auth/forms.responses.readonly,https://www.googleapis.com/auth/drive.file}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
