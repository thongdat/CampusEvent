spring.application.name=event-management-system

# T\u1ef1 n\u1ea1p credentials m\u00e1y local (file \u0111\u00e3 .gitignore - KH\u00d4NG commit l\u00ean git).
# N\u1ebfu kh\u00f4ng c\u00f3 file th\u00ec b\u1ecf qua, kh\u00f4ng l\u1ed7i.
spring.config.import=optional:classpath:application-local.properties

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=event_management_db;integratedSecurity=true;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=20000

# JPA/Hibernate Configuration
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.SQLServer2012Dialect}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# SQL Initialization
spring.sql.init.mode=never
#spring.sql.init.data-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=true

# Server Configuration
server.port=${PORT:${SERVER_PORT:8081}}
server.servlet.context-path=/api
# Azure App Service terminates HTTPS at its reverse proxy. Respect forwarded
# headers so redirects and OAuth callbacks use the public HTTPS scheme.
server.forward-headers-strategy=framework

# Logging \u2014 g\u1ecdn g\u00e0ng cho demo (t\u1eaft SQL/binder \u1ed3n \u00e0o; b\u1eadt l\u1ea1i DEBUG khi c\u1ea7n debug)
logging.level.root=INFO
logging.level.com.example=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Application Info
app.name=Event Management System
app.version=1.0.0
app.description=H\u1ec7 th\u1ed1ng qu\u1ea3n l\u00fd s\u1ef1 ki\u1ec7n sinh vi\u00ean

# Backfill d\u1eef li\u1ec7u demo r\u1ea5t n\u1eb7ng; ch\u1ec9 b\u1eadt th\u1ee7 c\u00f4ng khi c\u1ea7n t\u1ea1o l\u1ea1i d\u1eef li\u1ec7u qu\u00e1 kh\u1ee9.
app.past-event-backfill.enabled=${APP_PAST_EVENT_BACKFILL_ENABLED:false}

# Public URL cho QR scan b\u1eb1ng \u0111i\u1ec7n tho\u1ea1i.
# \u0110\u1ec3 tr\u1ed1ng: n\u1ebfu event c\u00f3 Google Form, QR s\u1ebd tr\u1ecf th\u1eb3ng t\u1edbi Google Form \u0111\u1ec3 \u0111i\u1ec7n tho\u1ea1i qu\u00e9t \u0111\u01b0\u1ee3c.
# N\u1ebfu mu\u1ed1n gi\u1eef lu\u1ed3ng ch\u1ed1ng screenshot b\u1eb1ng token 30s, set bi\u1ebfn m\u00f4i tr\u01b0\u1eddng APP_PUBLIC_BASE_URL
# th\u00e0nh URL \u0111i\u1ec7n tho\u1ea1i truy c\u1eadp \u0111\u01b0\u1ee3c, v\u00ed d\u1ee5 http://192.168.1.20:8081 ho\u1eb7c URL ngrok.
app.public-base-url=${APP_PUBLIC_BASE_URL:}

# =========================================================
# OAuth2 - Google Login
# =========================================================
# KH\u00d4NG commit Client ID / Secret th\u1eadt v\u00e0o file n\u00e0y.
# N\u1ebfu \u0111\u1ec3 tr\u1ed1ng, n\u00fat "\u0110\u0103ng nh\u1eadp Google" tr\u00ean trang /api/login.html s\u1ebd t\u1ef1 \u1ea9n
# (xem endpoint /api/auth/oauth-status).
#
# C\u00e1ch l\u1ea5y Client ID/Secret:
#   1. V\u00e0o https://console.cloud.google.com/apis/credentials
#   2. Create Credentials -> OAuth client ID -> Web application
#   3. Authorized redirect URIs:
#        http://localhost:8081/api/login/oauth2/code/google
#   4. Copy Client ID + Client Secret
#
# C\u00e1ch \u00e1p d\u1ee5ng (ch\u1ecdn 1):
#   A) Set bi\u1ebfn m\u00f4i tr\u01b0\u1eddng tr\u01b0\u1edbc khi ch\u1ea1y (khuy\u00ean d\u00f9ng):
#        Windows PowerShell:
#          $env:GOOGLE_CLIENT_ID="..."; $env:GOOGLE_CLIENT_SECRET="..."
#        macOS/Linux:
#          export GOOGLE_CLIENT_ID=... ; export GOOGLE_CLIENT_SECRET=...
#   B) T\u1ea1o file `application-local.properties` (\u0111\u00e3 .gitignore) v\u00e0 \u0111\u1eb7t gi\u00e1 tr\u1ecb
#      th\u1eadt \u1edf \u0111\u00f3, ch\u1ea1y v\u1edbi --spring.profiles.active=local.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:disabled-client}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:disabled-secret}
# Google Forms is a core AEMS feature, so the default OAuth request must include
# every scope used by create/share/sync. GOOGLE_OAUTH_SCOPES remains overridable.
spring.security.oauth2.client.registration.google.scope=${GOOGLE_OAUTH_SCOPES:openid,profile,email,https://www.googleapis.com/auth/forms.body,https://www.googleapis.com/auth/forms.responses.readonly,https://www.googleapis.com/auth/drive.file}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/api/login/oauth2/code/google}

# Gmail SMTP Configuration (G\u1eedi OTP)
# H\u01b0\u1edbng d\u1eabn l\u1ea5y App Password:
# 1. V\u00e0o https://myaccount.google.com/security
# 2. B\u1eadt x\u00e1c minh 2 b\u01b0\u1edbc (2-Step Verification)
# 3. V\u00e0o "App passwords" -> T\u1ea1o password cho "Mail"
# 4. Set bi\u1ebfn m\u00f4i tr\u01b0\u1eddng SMTP_USERNAME, SMTP_PASSWORD (KH\u00d4NG commit l\u00ean git)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# === Brevo HTTP email API (c\u1ed5ng 443) ===
# D\u00f9ng khi host ch\u1eb7n SMTP outbound (vd Render free tier ch\u1eb7n 25/465/587).
# N\u1ebfu BREVO_API_KEY r\u1ed7ng -> app t\u1ef1 d\u00f9ng SMTP Gmail \u1edf tr\u00ean (ch\u1ea1y local OK).
# Sender ph\u1ea3i l\u00e0 email \u0111\u00e3 verify trong Brevo (m\u1eb7c \u0111\u1ecbnh l\u1ea5y theo SMTP_USERNAME).
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:${SMTP_USERNAME:}}
brevo.sender.name=${BREVO_SENDER_NAME:Campus Events}
