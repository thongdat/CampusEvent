<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz checkout — AEMS</title>
    <link rel="stylesheet" th:href="@{/css/aems.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="aems">
<div class="aems-stripe"></div>
<main class="aems-shell" style="max-width: 780px;">
    <header class="aems-header">
        <div class="aems-header__brand">
            <span class="aems-header__mark">Q</span>
            <div>
                <span class="aems-eyebrow">AEMS · Bước 1/2 trước checkout</span>
                <h1 class="aems-header__title">Quiz nhanh về nội dung event</h1>
                <p class="aems-header__sub">5 câu ngẫu nhiên — hoàn thành để mở bước feedback.</p>
            </div>
        </div>
    </header>

    <div id="quizState"></div>
    <form id="quizForm" style="display: grid; gap: 1rem;"></form>

    <div class="aems-flex" style="margin-top: 1.5rem; justify-content: space-between;">
        <a class="aems-btn" th:href="@{/screen-student.html}">← Để sau</a>
        <a class="aems-btn aems-btn--ghost" th:href="@{'/student/attendance/events/' + ${eventId} + '/checkout-feedback'}">Bỏ qua → Feedback</a>
    </div>
</main>
<script th:inline="javascript">
const eventId = [[${eventId}]];
const email = (JSON.parse(sessionStorage.getItem('user') || '{}').email) || sessionStorage.getItem('userEmail') || '';
async function loadQuiz() {
    const state = document.getElementById('quizState');
    const form = document.getElementById('quizForm');
    try {
        const res = await fetch(`/api/student/quiz/events/${eventId}/questions?limit=5`);
        if (!res.ok) throw new Error(await res.text());
        const qs = await res.json();
        if (!qs.length) {
            state.innerHTML = '<div class="aems-card"><div class="aems-card__body" style="text-align:center; padding:2rem;"><p style="font-size:2.5rem;margin:0;">📭</p><p style="margin:.5rem 0 0; font-weight:700;">Khoa chưa tạo quiz cho event này.</p><p style="margin:.25rem 0 0; color:var(--aems-ink-muted); font-size:.9rem;">Bạn có thể bỏ qua và tới bước feedback.</p></div></div>';
            return;
        }
        form.innerHTML = qs.map((q, i) => `
            <div class="aems-card">
                <div class="aems-card__body">
                    <input type="hidden" name="questionId" value="${q.id}">
                    <h3 style="margin: 0 0 .85rem; font-size: 1rem;">Câu ${i + 1}. ${q.questionText}</h3>
                    ${q.questionType === 'MULTIPLE_CHOICE'
                        ? ['A','B','C','D'].filter(k => q['option' + k]).map(k => `
                            <label style="display:flex; gap:.65rem; padding:.6rem .85rem; border:1px solid var(--aems-line); border-radius:10px; margin-top:.35rem; cursor:pointer; background:#fff;">
                                <input type="radio" name="selectedAnswer-${q.id}" value="${k}" style="accent-color: var(--aems-fpt);">
                                <span><strong>${k}.</strong> ${q['option' + k]}</span>
                            </label>`).join('')
                        : `<textarea class="aems-textarea" name="answerText-${q.id}" rows="3" placeholder="Câu trả lời của bạn..."></textarea>`}
                </div>
            </div>`).join('') + '<button class="aems-btn aems-btn--primary" style="justify-self: end;">✓ Nộp quiz</button>';
    } catch (e) {
        state.innerHTML = `<div class="aems-card"><div class="aems-card__body" style="text-align:center; padding:2rem; color:#b91c1c;">⚠ ${e.message}</div></div>`;
    }
}
document.getElementById('quizForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (!email) { alert('Vui lòng đăng nhập trước.'); location.href = '/api/login.html'; return; }
    const answers = [...document.querySelectorAll('input[name=questionId]')].map(input => ({
        questionId: input.value,
        selectedAnswer: document.querySelector(`input[name="selectedAnswer-${input.value}"]:checked`)?.value,
        answerText: document.querySelector(`textarea[name="answerText-${input.value}"]`)?.value
    }));
    const res = await fetch(`/api/student/quiz/events/${eventId}/submit`, {
        method: 'POST',
        headers: {'Content-Type':'application/json', 'X-User-Email': email},
        body: JSON.stringify({answers})
    });
    if (res.ok) {
        const data = await res.json();
        alert(`Đã nộp quiz · Điểm: ${data.totalScore.toFixed(1)}\nTiếp tục bước feedback.`);
        location.href = `/api/student/attendance/events/${eventId}/checkout-feedback`;
    } else {
        alert('Lỗi: ' + await res.text());
    }
});
loadQuiz();
</script>
</body>
</html>
