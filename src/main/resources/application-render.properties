# PostgreSQL / Neon profile used by Render.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect

# Entity classes still contain legacy SQL Server column definitions, so the
# portable PostgreSQL schema is initialized explicitly instead of generated.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-postgresql.sql
spring.jpa.defer-datasource-initialization=true

# SQL Server-only migration is disabled. Demo data is inserted idempotently
# through repositories after the PostgreSQL schema exists.
app.schema-migration.enabled=false
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.admin-password=${DEMO_ADMIN_PASSWORD:Campus@2026}
app.seed.department-password=${DEMO_DEPARTMENT_PASSWORD:Campus@2026}
app.seed.committee-password=${DEMO_COMMITTEE_PASSWORD:Campus@2026}
app.seed.student-password=${DEMO_STUDENT_PASSWORD:Campus@2026}
app.test-fill.enabled=false
app.past-event-backfill.enabled=false

# Keep the small Neon free-tier connection pool healthy.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
# Startup seeding/backfill legitimately holds one connection for a whole
# transaction, which on cold Neon exceeds the 20s base leak threshold and prints
# a noisy false-positive "connection leak" WARN. Disable it here; real hangs are
# still caught by connection-timeout + socketTimeout below.
spring.datasource.hikari.leak-detection-threshold=0
# Neon free tier scales compute to zero when idle and can drop idle TCP
# connections. Recycle pooled connections well before that and keep them warm
# so requests never reuse a dead socket.
spring.datasource.hikari.max-lifetime=150000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000
# The PostgreSQL driver has NO socket timeout by default, so a stalled Neon
# connection makes a request hang indefinitely. These caps turn an indefinite
# hang into a fast failure (the UI then shows fallback data instead of a
# never-ending spinner). socketTimeout is generous enough for Neon cold resume.
spring.datasource.hikari.data-source-properties.socketTimeout=45
spring.datasource.hikari.data-source-properties.connectTimeout=15
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.data-source-properties.loginTimeout=15
