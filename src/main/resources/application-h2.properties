# =========================================================
# PROFILE "h2" — Chạy app bằng H2 in-memory (KHÔNG cần cài SQL Server)
# Dùng cho demo / chạy Playwright E2E trên máy chưa có database.
#
# Cách chạy:
#   mvn spring-boot:run "-Dspring-boot.run.profiles=h2"
# hoặc set biến môi trường:
#   $env:SPRING_PROFILES_ACTIVE="h2"; mvn spring-boot:run
#
# Dữ liệu là in-memory: mất khi tắt app; mỗi lần khởi động sẽ seed lại.
# =========================================================

server.port=${PORT:8081}

# ---- H2 in-memory (chế độ H2 chuẩn) ----
# KHÔNG dùng MODE=MSSQLServer: schema do Hibernate (H2Dialect) tự tạo bằng
# ddl-auto=create nên không cần tương thích cú pháp SQL Server. Quan trọng hơn,
# ở MODE=MSSQLServer, H2 KHÔNG hiểu cú pháp phân trang "limit ?" mà H2Dialect
# sinh ra -> mọi truy vấn phân trang (users/rooms/email-logs/activity-logs) sẽ lỗi.
# NON_KEYWORDS=YEAR...: entity Student có cột "year" trùng từ khóa dành riêng của H2.
spring.datasource.url=jdbc:h2:mem:campus;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=YEAR,VALUE,KEY,USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ---- Hibernate tự tạo schema từ entity (không dùng script SQL Server) ----
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=INFO

# ---- Bật Open-Session-In-View cho profile demo/E2E ----
# application.properties gốc tắt (false). Một số endpoint (vd /admin/proposals,
# /committee/*) build DTO có truy cập quan hệ LAZY (Room) ngoài transaction ->
# LazyInitializationException. Bật true ở profile h2 để chạy demo mượt, KHÔNG
# ảnh hưởng cấu hình production.
spring.jpa.open-in-view=true

# ---- Tắt migration DDL thủ công (viết bằng cú pháp SQL Server thuần) ----
app.schema-migration.enabled=false

# ---- Bật seed dữ liệu demo (tài khoản theo vai trò) ----
app.seed.enabled=true
app.seed.admin-password=Campus@2026
app.seed.department-password=Campus@2026
app.seed.committee-password=Campus@2026
app.seed.student-password=Campus@2026
app.test-fill.enabled=false
app.past-event-backfill.enabled=false

# ---- H2 web console (tùy chọn): http://localhost:8081/api/h2-console ----
spring.h2.console.enabled=true
