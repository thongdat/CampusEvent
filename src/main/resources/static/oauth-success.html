<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập thành công - Campus Events</title>
    <link rel="icon" type="image/svg+xml" href="/api/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #142033;
            --muted: #657188;
            --line: #dce3eb;
            --soft: #f5f7fa;
            --orange: #e65300;
            --orange-dark: #b83d00;
            --green: #087f5b;
            --blue: #1769aa;
            --font-display: "Outfit", system-ui, sans-serif;
            --font-body: "DM Sans", system-ui, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100%; }
        body { min-height: 100vh; background: #eef2f6; color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }

        .site-header { height: 72px; display: flex; align-items: center; border-bottom: 1px solid var(--line); background: #fff; }
        .header-inner { width: min(1120px, calc(100% - 40px)); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; }
        .brand-symbol { display: grid; grid-template-columns: repeat(3, 8px); gap: 2px; padding: 8px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
        .brand-symbol span { display: block; width: 8px; height: 16px; }
        .brand-symbol span:nth-child(1) { background: #f36f21; }
        .brand-symbol span:nth-child(2) { background: #159447; }
        .brand-symbol span:nth-child(3) { background: #1676bc; }
        .brand-copy strong, .brand-copy span { display: block; letter-spacing: 0; }
        .brand-copy strong { font-family: var(--font-display); font-size: 16px; }
        .brand-copy span { margin-top: 1px; color: var(--muted); font-size: 10px; text-transform: uppercase; }
        .secure-label { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; font-weight: 700; }
        .secure-label::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }

        .page { min-height: calc(100vh - 72px); display: grid; align-items: center; padding: 40px 20px; }
        .transition-panel { width: min(1040px, 100%); min-height: 520px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 44%) minmax(0, 56%); overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #fff; box-shadow: 0 18px 50px -36px rgba(20,32,51,.45); }

        .campus-visual { position: relative; min-height: 520px; background: #18304d; }
        .campus-visual img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .campus-visual::after { content: ""; position: absolute; inset: 0; background: rgba(12,31,54,.54); }
        .visual-copy { position: absolute; z-index: 1; right: 28px; bottom: 30px; left: 28px; color: #fff; }
        .visual-copy p { margin-bottom: 8px; color: #ffb17a; font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .visual-copy h1 { max-width: 360px; font-family: var(--font-display); font-size: 30px; line-height: 1.2; letter-spacing: 0; }

        .status-pane { display: flex; align-items: center; padding: 52px; }
        .status-content { width: 100%; }
        .success-head { display: flex; align-items: flex-start; gap: 14px; }
        .check { display: grid; width: 42px; height: 42px; flex: 0 0 auto; place-items: center; border-radius: 50%; background: #e7f6f0; color: var(--green); }
        .check svg { width: 22px; height: 22px; }
        .success-copy h2 { font-family: var(--font-display); font-size: 26px; line-height: 1.2; letter-spacing: 0; }
        .hello { margin-top: 6px; color: var(--muted); font-size: 14px; }
        .hello strong { color: var(--ink); }

        .profile { margin-top: 30px; border-top: 1px solid var(--line); }
        .row { display: grid; grid-template-columns: 110px minmax(0,1fr); gap: 16px; align-items: center; min-height: 58px; border-bottom: 1px solid var(--line); }
        .row small { color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .row strong { min-width: 0; overflow: hidden; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
        .row-icon { display: none; }
        .role-pill { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 800; }
        .role-pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }
        .role-ADMIN::before { background: #c92a2a; }
        .role-STUDENT::before { background: var(--green); }
        .role-COMMITTEE::before { background: #d97706; }
        .role-DEPARTMENT::before { background: #7048e8; }

        .progress-wrap { margin-top: 28px; }
        .progress-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; color: var(--muted); font-size: 12px; font-weight: 700; }
        .timer { color: var(--orange); font-variant-numeric: tabular-nums; }
        .timer svg { display: none; }
        .bar { height: 4px; margin-top: 10px; overflow: hidden; background: #e9edf2; }
        .bar span { display: block; width: 0; height: 100%; background: var(--orange); animation: fill 2s linear forwards; }
        @keyframes fill { to { width: 100%; } }

        .actions { display: flex; gap: 10px; margin-top: 30px; }
        .btn { display: inline-flex; min-height: 46px; flex: 1; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); border-radius: 7px; padding: 11px 16px; font-size: 13px; font-weight: 800; text-decoration: none; transition: border-color .2s, background .2s, color .2s; }
        .btn svg { width: 16px; height: 16px; }
        .btn-ghost { background: #fff; color: #4b5563; }
        .btn-ghost:hover { border-color: #aeb9c7; background: var(--soft); }
        .btn-primary { border-color: var(--orange); background: var(--orange); color: #fff; }
        .btn-primary:hover { border-color: var(--orange-dark); background: var(--orange-dark); }

        @media (max-width: 820px) {
            .page { align-items: start; padding: 24px 16px; }
            .transition-panel { grid-template-columns: 1fr; min-height: 0; }
            .campus-visual { min-height: 210px; }
            .visual-copy h1 { font-size: 24px; }
            .status-pane { padding: 36px 28px; }
        }
        @media (max-width: 480px) {
            .site-header { height: 64px; }
            .header-inner { width: calc(100% - 28px); }
            .secure-label { display: none; }
            .page { min-height: calc(100vh - 64px); padding: 14px; }
            .campus-visual { min-height: 160px; }
            .visual-copy { right: 20px; bottom: 20px; left: 20px; }
            .visual-copy h1 { font-size: 21px; }
            .status-pane { padding: 28px 20px; }
            .success-copy h2 { font-size: 23px; }
            .row { grid-template-columns: 82px minmax(0,1fr); }
            .actions { flex-direction: column-reverse; }
            .btn { flex: none; width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .bar span { animation: none; width: 100%; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="landing.html">
                <span class="brand-symbol" aria-hidden="true"><span></span><span></span><span></span></span>
                <span class="brand-copy"><strong>Campus Events</strong><span>FPT University</span></span>
            </a>
            <span class="secure-label">Kết nối an toàn</span>
        </div>
    </header>

    <main class="page">
        <section class="transition-panel" aria-label="Đăng nhập thành công">
            <div class="campus-visual">
                <img src="img/fpt-campus.jpg" alt="Khuôn viên FPT University">
                <div class="visual-copy">
                    <p>Campus Events</p>
                    <h1>Sẵn sàng cho hoạt động tiếp theo của bạn.</h1>
                </div>
            </div>

            <div class="status-pane">
                <div class="status-content">
                    <div class="success-head">
                        <span class="check" aria-hidden="true">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                        </span>
                        <div class="success-copy">
                            <h2>Đăng nhập thành công</h2>
                            <p class="hello">Xin chào, <strong id="userName">...</strong></p>
                        </div>
                    </div>

                    <div class="profile">
                        <div class="row">
                            <span class="row-icon email-icon" aria-hidden="true"></span>
                            <small>Email</small>
                            <strong id="userEmail">...</strong>
                        </div>
                        <div class="row">
                            <span class="row-icon role-icon" aria-hidden="true"></span>
                            <small>Vai trò</small>
                            <strong><span class="role-pill" id="userRole">...</span></strong>
                        </div>
                    </div>

                    <div class="progress-wrap">
                        <div class="progress-head">
                            <span id="redirectText">Đang chuẩn bị trang...</span>
                            <span class="timer" id="countdown">2 giây</span>
                        </div>
                        <div class="bar" aria-hidden="true"><span></span></div>
                    </div>

                    <div class="actions">
                        <a class="btn btn-ghost" href="login.html">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>
                            Đổi tài khoản
                        </a>
                        <a class="btn btn-primary" href="#" id="goNow">
                            Vào trang chủ
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
    (function() {
        var params = new URLSearchParams(window.location.search);
        var email = params.get('email') || '';
        var name = params.get('name') || 'Người dùng';
        var role = String(params.get('role') || 'STUDENT').toUpperCase();
        var id = params.get('id') || '0';

        var routes = {
            ADMIN: 'admin-screen/overview.html',
            MANAGER: 'screen-department.html',
            DEPARTMENT: 'screen-department.html',
            COMMITTEE: 'screen-committee.html',
            STUDENT: 'screen-student.html'
        };
        var roleNames = {
            ADMIN: 'Quản trị viên',
            MANAGER: 'Trưởng khoa',
            DEPARTMENT: 'Khoa / Bộ môn',
            COMMITTEE: 'Hội đồng',
            STUDENT: 'Sinh viên'
        };
        var target = routes[role] || routes.STUDENT;

        document.getElementById('userName').textContent = name;
        document.getElementById('userEmail').textContent = email || 'Không có email';

        var rolePill = document.getElementById('userRole');
        rolePill.textContent = roleNames[role] || role;
        rolePill.className = 'role-pill role-' + role;

        document.getElementById('goNow').href = target;
        document.getElementById('redirectText').textContent = 'Đang chuyển tới trang chủ ' + (roleNames[role] || role).toLowerCase() + '...';

        var existingUser = {};
        try {
            existingUser = JSON.parse(sessionStorage.getItem('user') || '{}');
        } catch (e) {
            existingUser = {};
        }
        sessionStorage.setItem('user', JSON.stringify(Object.assign({}, existingUser, {
            id: parseInt(id, 10),
            fullName: name,
            email: email,
            role: role
        })));
        localStorage.setItem('userName', name);
        localStorage.setItem('userRole', role);

        var pendingReturn = localStorage.getItem('postLoginReturn');
        if (pendingReturn) {
            try {
                var safeUrl = new URL(pendingReturn, window.location.origin);
                if (safeUrl.origin === window.location.origin) {
                    localStorage.removeItem('postLoginReturn');
                    target = safeUrl.toString();
                    document.getElementById('goNow').href = target;
                    document.getElementById('redirectText').textContent = 'Đang quay lại trang trước...';
                }
            } catch (e) {
                localStorage.removeItem('postLoginReturn');
            }
        }

        var left = 2;
        var countdown = document.getElementById('countdown');
        var tick = setInterval(function() {
            left -= 1;
            countdown.textContent = Math.max(left, 0) + ' giây';
            if (left <= 0) clearInterval(tick);
        }, 1000);

        setTimeout(function() {
            window.location.href = target;
        }, 2000);
    })();
    </script>
</body>
</html>
