<!-- Header/Taskbar Component -->
<header class="header">
    <div class="header-container">
        <div class="header-left">
            <a href="dashboard.html" class="logo">
                <span class="logo-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="4" y="3" width="16" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M8 8h8M8 12h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <circle cx="16" cy="15" r="2.5" fill="#2563eb"/>
                        <path d="M15 15l.6.6 1.3-1.3" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <span class="logo-text">Campus Events</span>
            </a>
        </div>

        <div class="header-center">
            <div class="search-box">
                <input type="text" placeholder="Tìm kiếm sự kiện..." class="search-input">
                <button class="search-btn">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                        <path d="M8 14C11.3137 14 14 11.3137 14 8C14 4.68629 11.3137 2 8 2C4.68629 2 2 4.68629 2 8C2 11.3137 4.68629 14 8 14Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16 16L12.5 12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="header-right">
            <div class="header-icons">
                <button class="icon-btn notification-btn" title="Thông báo">
                    <span class="icon">🔔</span>
                    <span class="badge">3</span>
                </button>
                <button class="icon-btn message-btn" title="Tin nhắn">
                    <span class="icon">💬</span>
                    <span class="badge">2</span>
                </button>
                <button class="icon-btn settings-btn" title="Cài đặt">
                    <span class="icon">⚙️</span>
                </button>
            </div>

            <div class="user-menu">
                <button class="user-profile" id="userProfileBtn">
                    <img src="https://via.placeholder.com/32" alt="User Avatar" class="avatar">
                    <span class="user-name">Nguyễn Văn A</span>
                    <span class="dropdown-arrow">▼</span>
                </button>

                <div class="dropdown-menu" id="userDropdown">
                    <a href="#" class="dropdown-item">
                        <span class="item-icon">👤</span>
                        <span>Hồ sơ cá nhân</span>
                    </a>
                    <a href="#" class="dropdown-item">
                        <span class="item-icon">⚙️</span>
                        <span>Cài đặt tài khoản</span>
                    </a>
                    <a href="#" class="dropdown-item">
                        <span class="item-icon">🔒</span>
                        <span>Đổi mật khẩu</span>
                    </a>
                    <hr class="dropdown-divider">
                    <a href="login.html" class="dropdown-item danger btn-logout">
                        <span class="item-icon">🚪</span>
                        <span>Đăng xuất</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</header>
