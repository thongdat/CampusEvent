<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu — Campus Events</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0c0c0f; --ink-muted: #5c5c66;
            --surface: #ffffff; --surface-2: #f8fafc;
            --line: rgba(12,12,15,0.08); --line-strong: rgba(12,12,15,0.12);
            --accent: #2563eb; --accent-soft: rgba(37,99,235,0.1);
            --radius-xl: 28px; --radius-lg: 18px; --radius-md: 14px; --radius-sm: 12px;
            --ease-out: cubic-bezier(0.22,1,0.36,1);
            --font-display: "Outfit", system-ui, sans-serif;
            --font-body: "DM Sans", system-ui, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; font-family: var(--font-body); color: var(--ink); background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 65%); display: grid; place-items: center; padding: 1.5rem; -webkit-font-smoothing: antialiased; }

        .card {
            width: min(480px, 100%);
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: clamp(2rem, 5vw, 3rem);
            border: 1px solid var(--line-strong);
            box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 24px 48px -20px rgba(15,23,42,0.1);
        }

        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--ink-muted); font-size: 0.875rem; font-weight: 600; text-decoration: none; margin-bottom: 1.5rem; transition: color 0.2s; }
        .back-link:hover { color: var(--accent); }
        .back-link svg { width: 16px; height: 16px; }

        h1 { font-family: var(--font-display); font-size: 1.75rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 0.5rem; }
        .subtitle { color: var(--ink-muted); font-size: 0.9375rem; font-weight: 500; margin-bottom: 1.75rem; line-height: 1.6; }

        /* Steps indicator */
        .steps { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem; }
        .step { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 0.8125rem; font-weight: 700; border: 2px solid var(--line-strong); color: var(--ink-muted); transition: all 0.3s var(--ease-out); }
        .step.active { background: linear-gradient(135deg, #2563eb, #4f46e5); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
        .step.done { background: #16a34a; color: #fff; border-color: transparent; }
        .step-line { flex: 1; height: 2px; background: var(--line-strong); transition: background 0.3s; }
        .step-line.done { background: #16a34a; }

        .form-group { display: grid; gap: 0.5rem; margin-bottom: 1.25rem; }
        .form-group label { font-size: 0.875rem; font-weight: 600; color: var(--ink); }
        .form-group input { width: 100%; padding: 0.85rem 1rem; border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--surface-2); font-size: 1rem; font-family: inherit; color: var(--ink); transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; }
        .form-group input:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-soft); }
        .form-group input::placeholder { color: #9b9ba8; }

        /* OTP input */
        .otp-inputs { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.25rem; }
        .otp-inputs input { width: 52px; height: 60px; text-align: center; font-size: 1.5rem; font-weight: 700; font-family: var(--font-display); border-radius: var(--radius-sm); border: 2px solid var(--line-strong); background: var(--surface-2); color: var(--ink); transition: border-color 0.2s, box-shadow 0.2s; }
        .otp-inputs input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); background: var(--surface); }

        .btn-primary { width: 100%; padding: 0.92rem; border-radius: var(--radius-md); border: none; background: linear-gradient(135deg, #2563eb, #4f46e5); color: #f8fafc; font-size: 1rem; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: 0 1px 0 rgba(255,255,255,0.12) inset, 0 10px 28px -10px rgba(15,23,42,0.55); transition: transform 0.22s var(--ease-out), box-shadow 0.22s, filter 0.22s; }
        .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.05); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .btn-secondary { width: 100%; padding: 0.85rem; border-radius: var(--radius-md); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 0.9375rem; font-weight: 600; font-family: inherit; cursor: pointer; margin-top: 0.75rem; transition: background 0.2s, border-color 0.2s; }
        .btn-secondary:hover { background: var(--surface-2); border-color: var(--accent); }

        .resend-row { display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-top: 0.75rem; font-size: 0.8125rem; color: var(--ink-muted); }
        .resend-row button { background: none; border: none; color: var(--accent); font-weight: 700; cursor: pointer; font-family: inherit; font-size: 0.8125rem; }
        .resend-row button:disabled { color: var(--ink-muted); cursor: not-allowed; }

        .msg { display: none; padding: 0.85rem 1rem; border-radius: var(--radius-sm); font-size: 0.875rem; font-weight: 600; margin-bottom: 1rem; }
        .msg.error { display: block; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .msg.success { display: block; background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }

        .password-row { display: grid; gap: 1rem; }

        .hidden { display: none !important; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.35s var(--ease-out) forwards; }
    </style>
</head>
<body>
    <div class="card">
        <a href="login.html" class="back-link">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            Quay lại đăng nhập
        </a>

        <h1 id="pageTitle">Quên mật khẩu</h1>
        <p class="subtitle" id="pageSubtitle">Nhập email đã đăng ký để nhận mã xác nhận (OTP).</p>

        <!-- Steps indicator -->
        <div class="steps">
            <div class="step active" id="step1">1</div>
            <div class="step-line" id="line1"></div>
            <div class="step" id="step2">2</div>
            <div class="step-line" id="line2"></div>
            <div class="step" id="step3">3</div>
        </div>

        <div id="msgBox" class="msg" role="alert"></div>

        <!-- Step 1: Enter Email -->
        <form id="emailForm" class="fade-in">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
            </div>
            <button type="submit" class="btn-primary" id="btnSendOtp">Gửi mã xác nhận</button>
        </form>

        <!-- Step 2: Enter OTP -->
        <form id="otpForm" class="hidden">
            <p style="text-align:center;color:var(--ink-muted);font-size:0.9375rem;margin-bottom:1.25rem;">
                Mã OTP đã gửi tới <strong id="emailDisplay"></strong>
            </p>
            <div class="otp-inputs" id="otpInputs">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
            </div>
            <button type="submit" class="btn-primary" id="btnVerifyOtp">Xác nhận mã OTP</button>
            <div class="resend-row">
                <span>Chưa nhận được?</span>
                <button type="button" id="btnResend" disabled>Gửi lại (<span id="countdown">60</span>s)</button>
            </div>
        </form>

        <!-- Step 3: New Password -->
        <form id="passwordForm" class="hidden">
            <div class="password-row">
                <div class="form-group">
                    <label for="newPassword">Mật khẩu mới</label>
                    <input type="password" id="newPassword" placeholder="Ít nhất 8 ký tự" required minlength="8">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Nhập lại mật khẩu</label>
                    <input type="password" id="confirmPassword" placeholder="Xác nhận mật khẩu mới" required>
                </div>
            </div>
            <button type="submit" class="btn-primary" id="btnResetPwd" style="margin-top:0.5rem;">Đặt lại mật khẩu</button>
        </form>
    </div>

    <script>
    (function() {
        var savedEmail = '';
        var savedOtp = '';
        var countdownTimer = null;

        var emailForm = document.getElementById('emailForm');
        var otpForm = document.getElementById('otpForm');
        var passwordForm = document.getElementById('passwordForm');
        var msgBox = document.getElementById('msgBox');
        var pageTitle = document.getElementById('pageTitle');
        var pageSubtitle = document.getElementById('pageSubtitle');

        function showMsg(text, type) { msgBox.className = 'msg ' + type; msgBox.textContent = text; }
        function clearMsg() { msgBox.className = 'msg'; msgBox.textContent = ''; }

        function setStep(n) {
            document.getElementById('step1').className = 'step ' + (n >= 1 ? (n > 1 ? 'done' : 'active') : '');
            document.getElementById('step2').className = 'step ' + (n >= 2 ? (n > 2 ? 'done' : 'active') : '');
            document.getElementById('step3').className = 'step ' + (n >= 3 ? 'active' : '');
            document.getElementById('line1').className = 'step-line' + (n > 1 ? ' done' : '');
            document.getElementById('line2').className = 'step-line' + (n > 2 ? ' done' : '');
            if (n > 1) document.getElementById('step1').textContent = '✓';
            if (n > 2) document.getElementById('step2').textContent = '✓';
        }

        // ======== STEP 1: Send OTP ========
        emailForm.addEventListener('submit', function(e) {
            e.preventDefault();
            clearMsg();
            var email = document.getElementById('email').value.trim();
            if (!email || !email.includes('@')) { showMsg('Vui lòng nhập email hợp lệ.', 'error'); return; }

            var btn = document.getElementById('btnSendOtp');
            btn.disabled = true; btn.textContent = 'Đang gửi...';

            fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                btn.disabled = false; btn.textContent = 'Gửi mã xác nhận';
                if (data.success) {
                    savedEmail = email;
                    showMsg(data.message, 'success');
                    setTimeout(function() {
                        clearMsg();
                        emailForm.classList.add('hidden');
                        otpForm.classList.remove('hidden');
                        otpForm.classList.add('fade-in');
                        document.getElementById('emailDisplay').textContent = email;
                        setStep(2);
                        pageTitle.textContent = 'Nhập mã OTP';
                        pageSubtitle.textContent = 'Kiểm tra hộp thư email của bạn.';
                        startCountdown();
                        // Focus first OTP input
                        document.querySelector('#otpInputs input').focus();
                    }, 800);
                } else {
                    showMsg(data.message, 'error');
                }
            })
            .catch(function() {
                btn.disabled = false; btn.textContent = 'Gửi mã xác nhận';
                showMsg('Lỗi kết nối. Vui lòng thử lại.', 'error');
            });
        });

        // ======== OTP Input Auto-Focus ========
        var otpInputs = document.querySelectorAll('#otpInputs input');
        otpInputs.forEach(function(inp, i) {
            inp.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
                if (this.value && i < otpInputs.length - 1) otpInputs[i + 1].focus();
            });
            inp.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value && i > 0) otpInputs[i - 1].focus();
            });
            inp.addEventListener('paste', function(e) {
                e.preventDefault();
                var paste = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
                for (var j = 0; j < Math.min(paste.length, otpInputs.length); j++) {
                    otpInputs[j].value = paste[j];
                }
                if (paste.length >= otpInputs.length) otpInputs[otpInputs.length - 1].focus();
                else if (paste.length > 0) otpInputs[paste.length].focus();
            });
        });

        function getOtpValue() {
            var v = '';
            otpInputs.forEach(function(inp) { v += inp.value; });
            return v;
        }

        // ======== STEP 2: Verify OTP ========
        otpForm.addEventListener('submit', function(e) {
            e.preventDefault();
            clearMsg();
            var otp = getOtpValue();
            if (otp.length !== 6) { showMsg('Vui lòng nhập đủ 6 chữ số OTP.', 'error'); return; }

            var btn = document.getElementById('btnVerifyOtp');
            btn.disabled = true; btn.textContent = 'Đang xác minh...';

            fetch('/api/auth/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: savedEmail, otp: otp })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                btn.disabled = false; btn.textContent = 'Xác nhận mã OTP';
                if (data.success) {
                    savedOtp = otp;
                    showMsg(data.message, 'success');
                    setTimeout(function() {
                        clearMsg();
                        otpForm.classList.add('hidden');
                        passwordForm.classList.remove('hidden');
                        passwordForm.classList.add('fade-in');
                        setStep(3);
                        pageTitle.textContent = 'Đặt lại mật khẩu';
                        pageSubtitle.textContent = 'Tạo mật khẩu mới cho tài khoản của bạn.';
                        document.getElementById('newPassword').focus();
                    }, 800);
                } else {
                    showMsg(data.message, 'error');
                }
            })
            .catch(function() {
                btn.disabled = false; btn.textContent = 'Xác nhận mã OTP';
                showMsg('Lỗi kết nối. Vui lòng thử lại.', 'error');
            });
        });

        // ======== STEP 3: Reset Password ========
        passwordForm.addEventListener('submit', function(e) {
            e.preventDefault();
            clearMsg();
            var newPwd = document.getElementById('newPassword').value;
            var confirmPwd = document.getElementById('confirmPassword').value;

            if (newPwd.length < 8) { showMsg('Mật khẩu phải có ít nhất 8 ký tự.', 'error'); return; }
            if (newPwd !== confirmPwd) { showMsg('Mật khẩu xác nhận không khớp.', 'error'); return; }

            var btn = document.getElementById('btnResetPwd');
            btn.disabled = true; btn.textContent = 'Đang xử lý...';

            fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: savedEmail, otp: savedOtp, newPassword: newPwd })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                btn.disabled = false; btn.textContent = 'Đặt lại mật khẩu';
                if (data.success) {
                    showMsg(data.message, 'success');
                    pageTitle.textContent = 'Thành công! 🎉';
                    pageSubtitle.textContent = 'Mật khẩu đã được thay đổi.';
                    passwordForm.innerHTML = '<a href="login.html" class="btn-primary" style="display:block;text-align:center;text-decoration:none;margin-top:1rem;">Đăng nhập ngay</a>';
                } else {
                    showMsg(data.message, 'error');
                }
            })
            .catch(function() {
                btn.disabled = false; btn.textContent = 'Đặt lại mật khẩu';
                showMsg('Lỗi kết nối. Vui lòng thử lại.', 'error');
            });
        });

        // ======== Resend OTP Countdown ========
        function startCountdown() {
            var seconds = 60;
            var btnResend = document.getElementById('btnResend');
            var cdSpan = document.getElementById('countdown');
            btnResend.disabled = true;
            if (countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(function() {
                seconds--;
                cdSpan.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(countdownTimer);
                    btnResend.disabled = false;
                    btnResend.textContent = 'Gửi lại';
                }
            }, 1000);
        }

        document.getElementById('btnResend').addEventListener('click', function() {
            clearMsg();
            this.disabled = true;
            fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: savedEmail })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                showMsg(data.success ? 'Đã gửi lại mã OTP!' : data.message, data.success ? 'success' : 'error');
                if (data.success) startCountdown();
            })
            .catch(function() { showMsg('Lỗi kết nối.', 'error'); });
        });
    })();
    </script>
</body>
</html>
