      <stop offset="0" stop-color="#0b3a82"/>
      <stop offset="0.55" stop-color="#0865c6"/>
      <stop offset="1" stop-color="#00a651"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.18" r="0.65">
