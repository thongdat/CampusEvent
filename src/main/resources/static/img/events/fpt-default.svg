  <text x="64" y="370" font-family="Inter, Segoe UI, sans-serif" font-weight="900" font-size="58" fill="#ffffff">Campus Events</text>
  <text x="64" y="420" font-family="Inter, Segoe UI, sans-serif" font-weight="500" font-size="22" fill="#e7efff">FPT University - Student Activity Hub</text>
  <text x="64" y="540" font-family="Inter, Segoe UI, sans-serif" font-weight="500" font-size="15" fill="#ffffff" fill-opacity="0.78">campus.fpt.edu.vn  -  Smart event management for FPT students</text>
