<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sự kiện · Campus Events</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .skeleton { background: linear-gradient(90deg,#eef2ff 0%,#e0e7ff 40%,#eef2ff 80%); background-size: 800px 100%; animation: shimmer 1.4s linear infinite; }
        @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
        .card-img-fallback { background: linear-gradient(135deg,#dbeafe,#c7d2fe 70%); }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">

<header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-3 px-4 sm:px-6">
        <a href="landing.html" class="flex items-center gap-2 font-bold tracking-tight text-slate-900">
            <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-sky-500 to-indigo-600 text-white">🎓</span>
            Campus Events
        </a>
        <div class="flex items-center gap-2">
            <a href="screen-student.html" class="hidden rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 sm:inline">Cổng sinh viên</a>
            <a id="loginCta" href="login.html" class="rounded-lg bg-slate-900 px-3 py-2 text-sm font-semibold text-white hover:bg-slate-800">Đăng nhập</a>
        </div>
    </div>
</header>

<nav class="mx-auto max-w-6xl px-4 pt-5 text-xs text-slate-500 sm:px-6">
    <a href="landing.html" class="hover:text-sky-700">Trang chủ</a>
    <span class="mx-1">/</span>
    <a href="screen-student.html" class="hover:text-sky-700">Sự kiện</a>
    <span class="mx-1">/</span>
    <span id="crumbTitle" class="text-slate-700">Đang tải...</span>
</nav>

<main id="content" class="mx-auto max-w-6xl px-4 py-6 sm:px-6">
    <div class="grid gap-6 lg:grid-cols-[1fr_360px]">
        <div class="space-y-4">
            <div class="skeleton h-72 w-full rounded-3xl"></div>
            <div class="skeleton h-8 w-2/3 rounded"></div>
            <div class="skeleton h-5 w-1/2 rounded"></div>
        </div>
        <div class="space-y-4">
            <div class="skeleton h-44 w-full rounded-3xl"></div>
            <div class="skeleton h-32 w-full rounded-3xl"></div>
        </div>
    </div>
</main>

<div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-50 -translate-x-1/2 rounded-xl bg-slate-900 px-4 py-3 text-sm font-semibold text-white opacity-0 shadow-2xl transition-opacity"></div>

<footer class="border-t border-slate-200 bg-white py-6 text-center text-xs text-slate-500">
    Campus Events · <a href="landing.html" class="font-semibold text-sky-700 hover:underline">Về trang chủ</a>
</footer>

<script>
(function () {
    'use strict';

    const API_BASE = '/api';
    const id = Number(new URLSearchParams(location.search).get('id') || 0);
    if (!id) {
        $('content').innerHTML = '<div class="rounded-3xl border-2 border-dashed border-rose-200 bg-rose-50 p-12 text-center text-rose-700">Thiếu tham số <code>?id=…</code></div>';
        return;
    }

    let sessionUser = null;
    try { sessionUser = JSON.parse(sessionStorage.getItem('user') || '{}'); } catch (e) {}
    const userEmail = sessionUser && sessionUser.email;

    function $(s, r = document) { return r.querySelector ? r.querySelector(s) : document.getElementById(s); }
    function $$(s, r = document) { return Array.from((r.querySelectorAll ? r : document).querySelectorAll(s)); }
    function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function toast(msg, tone) {
        const el = document.getElementById('toast');
        el.style.background = tone === 'error' ? '#dc2626' : tone === 'warn' ? '#d97706' : '#0f172a';
        el.textContent = msg;
        el.style.opacity = '1';
        clearTimeout(toast._t);
        toast._t = setTimeout(() => el.style.opacity = '0', 2600);
    }

    function fmt(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        return isNaN(d.getTime()) ? iso : d.toLocaleString('vi-VN', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    function fmtTime(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return isNaN(d.getTime()) ? '' : d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
    }
    function priorityTone(score) {
        if (score >= 80) return { ring: '#059669', text: 'text-emerald-700', bg: 'bg-emerald-50', border: 'border-emerald-200', label: 'Rất cao' };
        if (score >= 65) return { ring: '#0284c7', text: 'text-sky-700',     bg: 'bg-sky-50',     border: 'border-sky-200',     label: 'Cao' };
        if (score >= 50) return { ring: '#d97706', text: 'text-amber-700',   bg: 'bg-amber-50',   border: 'border-amber-200',   label: 'Trung bình' };
        return                  { ring: '#dc2626', text: 'text-rose-700',    bg: 'bg-rose-50',    border: 'border-rose-200',    label: 'Thấp' };
    }
    function statusBadge(status) {
        const map = {
            'REGISTERED':  { cls: 'bg-emerald-100 text-emerald-700',   label: '✓ Đã đăng ký' },
            'WAITLIST':    { cls: 'bg-amber-100 text-amber-800',       label: '⏳ Hàng chờ' },
            'PUBLISHED':   { cls: 'bg-sky-100 text-sky-700',           label: '📢 Đang mở' },
            'COMPLETED':   { cls: 'bg-slate-100 text-slate-600',       label: '✅ Đã kết thúc' }
        };
        const e = map[(status || '').toUpperCase()] || { cls: 'bg-slate-100 text-slate-600', label: status || '—' };
        return `<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold ${e.cls}">${e.label}</span>`;
    }

    async function api(path, opts = {}) {
        const headers = Object.assign({ 'Accept': 'application/json' }, opts.headers || {});
        if (userEmail) headers['X-User-Email'] = userEmail;
        if (opts.body && typeof opts.body !== 'string') {
            headers['Content-Type'] = 'application/json';
            opts.body = JSON.stringify(opts.body);
        }
        const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
        if (!res.ok) throw new Error(await res.text() || ('HTTP ' + res.status));
        return res.json();
    }

    async function load() {
        try {
            const e = await api('/student/events/' + id);
            document.title = (e.title || 'Sự kiện') + ' · Campus Events';
            document.getElementById('crumbTitle').textContent = e.title || '—';
            render(e);
        } catch (err) {
            document.getElementById('content').innerHTML = `<div class="rounded-3xl border-2 border-dashed border-rose-200 bg-rose-50 p-12 text-center"><p class="text-base font-semibold text-rose-800">Không tải được sự kiện</p><p class="mt-2 text-sm text-rose-700">${escapeHtml(err.message)}</p></div>`;
        }
    }

    function render(e) {
        const dept = e.department ? e.department.name : '—';
        const score = Math.round((e.priorityPreview || 0) * 10) / 10;
        const tone = priorityTone(score);
        const fill = e.fillRate == null ? 0 : e.fillRate;
        const isPast = e.startTime && new Date(e.startTime) < new Date();
        const myStatus = e.myStatus || '';
        const bd = e.priorityBreakdown;
        const speakers = (e.speakers || e.organizer || '').trim();

        const queueHtml = (e.queue || []).length === 0 ? '<p class="text-sm text-slate-500">Chưa có ai đăng ký.</p>' : `
            <ol class="space-y-2">
                ${e.queue.map((q, i) => `
                <li class="flex items-center justify-between rounded-xl border border-slate-100 bg-slate-50/60 px-3 py-2 text-sm">
                    <span class="flex items-center gap-3">
                        <span class="inline-flex h-6 w-6 items-center justify-center rounded-full bg-white text-xs font-bold text-slate-700 shadow-sm">${i + 1}</span>
                        <span>
                            <span class="font-semibold text-slate-800">${escapeHtml(q.name)}</span>
                            <span class="ml-1 text-xs text-slate-500">· ${escapeHtml(q.major || '—')}</span>
                        </span>
                    </span>
                    <span class="flex items-center gap-2">${statusBadge(q.status)}<span class="font-mono text-xs font-semibold text-slate-700">${q.priority == null ? '—' : Number(q.priority).toFixed(1)}</span></span>
                </li>`).join('')}
            </ol>`;

        const fbHtml = (e.feedbacks || []).length === 0 ? '' : `
            <section class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
                <h3 class="text-sm font-bold text-slate-900">⭐ Phản hồi nổi bật</h3>
                <div class="mt-3 space-y-2">
                    ${e.feedbacks.map(f => `
                    <div class="rounded-xl border border-slate-100 bg-slate-50 p-3 text-sm">
                        <div class="flex items-center gap-2"><span class="text-amber-500">${'★'.repeat(f.rating || 0)}${'☆'.repeat(5 - (f.rating || 0))}</span><span class="text-xs font-semibold text-slate-600">${escapeHtml(f.author)}</span></div>
                        <p class="mt-1 text-slate-700">${escapeHtml(f.comment)}</p>
                    </div>`).join('')}
                </div>
            </section>`;

        const action = !userEmail
            ? `<a href="login.html" class="block w-full rounded-xl bg-gradient-to-r from-sky-600 to-blue-700 py-3 text-center text-sm font-semibold text-white shadow-lg shadow-sky-500/30 hover:brightness-110">Đăng nhập để đăng ký</a>`
            : isPast
            ? `<button disabled class="w-full cursor-not-allowed rounded-xl border border-slate-200 bg-slate-100 py-3 text-sm font-semibold text-slate-400">Đã diễn ra</button>`
            : (myStatus === 'REGISTERED' || myStatus === 'WAITLIST')
            ? `<button id="btnCancel" data-id="${e.myRegistrationId}" class="w-full rounded-xl border border-rose-200 bg-white py-3 text-sm font-semibold text-rose-700 hover:bg-rose-50">${myStatus === 'WAITLIST' ? '⏳ Đang trong hàng chờ · Huỷ' : '✓ Đã đăng ký · Huỷ'}</button>`
            : `<button id="btnRegister" class="block w-full rounded-xl bg-gradient-to-r from-sky-600 to-blue-700 py-3 text-sm font-semibold text-white shadow-lg shadow-sky-500/30 hover:brightness-110">Đăng ký · điểm ưu tiên ${score}</button>`;

        const priorityCard = userEmail && bd ? `
            <section class="rounded-3xl border ${tone.border} ${tone.bg} p-5">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs font-bold uppercase tracking-widest ${tone.text}">Điểm ưu tiên của bạn</p>
                        <p class="mt-1 text-3xl font-bold ${tone.text}">${score}<span class="ml-1 text-sm font-medium text-slate-500">/100 · ${tone.label}</span></p>
                    </div>
                    <div class="flex h-16 w-16 items-center justify-center rounded-full" style="background:conic-gradient(${tone.ring} ${Math.min(100, score)}%, #e2e8f0 0);">
                        <span class="flex h-12 w-12 items-center justify-center rounded-full bg-white text-base font-bold ${tone.text}">${Math.round(score)}</span>
                    </div>
                </div>
                <div class="mt-4 space-y-2.5 text-xs">
                    ${['M','S','P','T'].map(k => {
                        const v = bd[k] || { label: k, score: 0, weight: 0, contribution: 0 };
                        const color = { 'M':'#10b981','S':'#f59e0b','P':'#ef4444','T':'#0ea5e9' }[k];
                        return `<div>
                            <div class="mb-1 flex items-center justify-between">
                                <span class="font-semibold text-slate-700"><span style="color:${color}">●</span> ${escapeHtml(v.label)} <span class="text-slate-400">(${v.weight}%)</span></span>
                                <span class="font-mono text-slate-600">${v.score} → +${v.contribution}</span>
                            </div>
                            <div class="h-2 overflow-hidden rounded-full bg-slate-100"><div class="h-full transition-all duration-700" style="width:${Math.min(100, v.score)}%;background:${color}"></div></div>
                        </div>`;
                    }).join('')}
                </div>
            </section>` : '';

        document.getElementById('content').innerHTML = `
        <div class="grid gap-6 lg:grid-cols-[1fr_360px]">
            <article class="space-y-6">
                <div class="relative overflow-hidden rounded-3xl shadow-xl">
                    ${e.imageUrl ? `<img src="${escapeHtml(e.imageUrl)}" alt="" class="h-80 w-full object-cover">` : '<div class="card-img-fallback flex h-80 w-full items-center justify-center text-6xl">🎓</div>'}
                    <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"></div>
                    <div class="absolute inset-x-6 bottom-6 text-white">
                        <p class="text-xs font-bold uppercase tracking-widest text-sky-100">${escapeHtml(dept)}</p>
                        <h1 class="mt-2 text-3xl font-bold leading-tight sm:text-4xl">${escapeHtml(e.title)}</h1>
                        <p class="mt-2 text-sm text-sky-50">${fmt(e.startTime)} · ${escapeHtml(e.location || '—')}</p>
                    </div>
                </div>

                <section class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
                    <h2 class="text-sm font-bold uppercase tracking-widest text-slate-500">Mô tả sự kiện</h2>
                    <p class="mt-3 whitespace-pre-line text-base leading-relaxed text-slate-700">${escapeHtml(e.description || 'Đang cập nhật...')}</p>
                </section>

                <section class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
                    <h3 class="text-sm font-bold text-slate-900">🪪 Hàng đợi ưu tiên (top 8)</h3>
                    <p class="mt-1 text-xs text-slate-500">Slot sẽ ưu tiên người có điểm cao nhất. Người điểm thấp tự động được chuyển sang hàng chờ khi event đầy.</p>
                    <div class="mt-3">${queueHtml}</div>
                </section>

                <section class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
                    <h2 class="text-sm font-bold uppercase tracking-widest text-slate-500">Diễn giả</h2>
                    <p class="mt-3 whitespace-pre-line text-base leading-relaxed text-slate-700">${escapeHtml(speakers || 'Đang cập nhật...')}</p>
                </section>

                ${fbHtml}
            </article>

            <aside class="space-y-4 lg:sticky lg:top-20 lg:self-start">
                <section class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
                    <p class="text-xs font-semibold uppercase tracking-widest text-slate-500">Đăng ký</p>
                    <div class="mt-2 flex items-baseline justify-between">
                        <span class="text-2xl font-bold text-slate-900">${e.registeredCount || 0}<span class="text-base text-slate-500">/${e.capacity || '∞'}</span></span>
                        <span class="text-xs font-bold ${fill >= 95 ? 'text-rose-600' : fill >= 70 ? 'text-amber-600' : 'text-emerald-600'}">${fill}% đầy</span>
                    </div>
                    <div class="mt-2 h-2 overflow-hidden rounded-full bg-slate-100"><div class="h-full ${fill >= 95 ? 'bg-rose-500' : fill >= 70 ? 'bg-amber-500' : 'bg-emerald-500'}" style="width:${Math.min(100, fill)}%"></div></div>
                    <div class="mt-4 space-y-1 text-sm text-slate-600">
                        <p>📅 <strong class="text-slate-800">${fmt(e.startTime)}</strong></p>
                        <p>⏰ Kết thúc lúc <strong class="text-slate-800">${fmtTime(e.endTime)}</strong></p>
                        <p>📍 <strong class="text-slate-800">${escapeHtml(e.location || '—')}</strong></p>
                        <p>📊 ${statusBadge(e.status)}</p>
                    </div>
                    <div class="mt-5">${action}</div>
                </section>

                ${priorityCard}

                <section class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
                    <p class="text-xs font-semibold uppercase tracking-widest text-slate-500">Chia sẻ</p>
                    <div class="mt-3 flex gap-2">
                        <button data-share="copy" class="flex flex-1 items-center justify-center gap-1 rounded-xl border border-slate-200 bg-white py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">🔗 Sao chép link</button>
                        <a target="_blank" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}" class="flex flex-1 items-center justify-center gap-1 rounded-xl bg-blue-600 py-2 text-sm font-semibold text-white hover:bg-blue-700">Facebook</a>
                    </div>
                </section>
            </aside>
        </div>`;

        const btnReg = document.getElementById('btnRegister');
        if (btnReg) btnReg.addEventListener('click', registerEvent);
        const btnCancel = document.getElementById('btnCancel');
        if (btnCancel) btnCancel.addEventListener('click', () => cancel(Number(btnCancel.dataset.id)));
        $$('[data-share="copy"]').forEach(b => b.addEventListener('click', () => {
            navigator.clipboard.writeText(location.href).then(() => toast('Đã sao chép link'));
        }));
    }

    async function registerEvent() {
        try {
            const r = await api('/student/events/' + id + '/register', { method: 'POST', body: {} });
            showRegistrationConfirmation(r);
            load();
        } catch (e) {
            toast(e.message, 'error');
        }
    }

    function showRegistrationConfirmation(result) {
        const registered = result.status === 'REGISTERED';
        const email = result.notificationEmail || userEmail || '';
        const steps = Array.isArray(result.nextSteps) ? result.nextSteps : [];
        const overlay = document.createElement('div');
        overlay.className = 'fixed inset-0 z-50 grid place-items-center bg-slate-950/50 p-4 backdrop-blur-sm';
        overlay.innerHTML = `<div class="w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl">
            <div class="flex items-start gap-4"><span class="grid h-12 w-12 shrink-0 place-items-center rounded-full ${registered ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'} text-2xl font-bold">${registered ? '✓' : '⌛'}</span><div><h3 class="text-xl font-bold text-slate-900">${registered ? 'Đăng ký thành công' : 'Đã vào danh sách chờ'}</h3><p class="mt-1 text-sm text-slate-600">${registered ? 'Suất tham dự của bạn đã được xác nhận.' : 'Hệ thống sẽ tự động cập nhật khi có suất trống.'}</p></div></div>
            ${result.ticketCode ? `<div class="mt-5 rounded-xl border border-emerald-200 bg-emerald-50 p-3"><span class="text-xs font-bold uppercase text-emerald-700">Mã vé</span><p class="mt-1 font-mono text-lg font-bold">${escapeHtml(result.ticketCode)}</p></div>` : ''}
            <div class="mt-3 rounded-xl border border-sky-200 bg-sky-50 p-4"><p class="font-semibold text-slate-900">✉ Thông tin email</p><p class="mt-1 text-sm leading-6 text-slate-600">${escapeHtml(result.emailMessage || '')}</p>${email ? `<p class="mt-1 break-all text-xs font-bold text-sky-700">${escapeHtml(email)}</p>` : ''}</div>
            <div class="mt-4"><p class="text-sm font-semibold text-slate-900">Bước tiếp theo</p><ol class="mt-2 space-y-2 text-sm text-slate-600">${steps.map((step, i) => `<li><strong class="text-sky-700">${i + 1}.</strong> ${escapeHtml(step)}</li>`).join('')}</ol></div>
            <div class="mt-6 flex justify-end gap-2"><button data-close class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold">Đóng</button><a href="screen-student.html" class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white">Cổng sinh viên</a></div>
        </div>`;
        document.body.appendChild(overlay);
        overlay.querySelector('[data-close]').addEventListener('click', () => overlay.remove());
        overlay.addEventListener('click', event => { if (event.target === overlay) overlay.remove(); });
    }

    async function cancel(rid) {
        if (!rid || !confirm('Huỷ đăng ký?')) return;
        try {
            await api('/student/registrations/' + rid, { method: 'DELETE' });
            toast('Đã huỷ đăng ký');
            load();
        } catch (e) {
            toast(e.message, 'error');
        }
    }

    if (userEmail) {
        document.getElementById('loginCta').style.display = 'none';
    }
    load();
})();
</script>

</body>
</html>
